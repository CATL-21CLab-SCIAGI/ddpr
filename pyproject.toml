[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ddpr"
version = "0.1.0"
description = "Training for data-driven physics reasoning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]
physics = ["pydantic>=2.10", "sympy>=1.13"]

[tool.setuptools.packages.find]
include = ["ddpr*"]

[tool.setuptools.package-data]
"ddpr.rewards.physics" = ["LICENSE", "UPSTREAM.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Preserve upstream exception classification and answer-code restrictions.
"ddpr/rewards/physics/grader.py" = ["BLE001"]
"ddpr/rewards/physics/llm/clients/bedrock.py" = ["SIM117", "TRY004"]
"ddpr/rewards/physics/llm/equivalence.py" = ["C408", "UP037"]
"ddpr/rewards/physics/llm/clients/openai.py" = ["UP037", "UP041"]
"ddpr/rewards/physics/llm/utils.py" = ["TRY201"]
"ddpr/rewards/physics/llm/semantic.py" = ["BLE001", "UP037"]
"ddpr/rewards/physics/llm/clients/config.py" = ["TRY004"]
"ddpr/rewards/physics/answer.py" = ["S102", "TRY004"]
"ddpr/rewards/physics/runtime.py" = ["BLE001"]
"ddpr/rewards/physics/validation.py" = ["SIM101", "SIM102", "TRY004"]
"ddpr/rewards/physics/rule/numeric.py" = ["BLE001", "FURB136"]
"ddpr/rewards/physics/rule/symbolic.py" = ["BLE001", "S110"]
